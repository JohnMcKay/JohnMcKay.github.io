
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John McKay, PhD</title>
  <meta name="description" content="John McKay — Principal Data Scientist. Applied AI, machine learning, and research." />

  <link rel="shortcut icon" href="figs/ipal.png" />

  <style>
    :root {
      --bg: #0b0c10;
      --panel: #111217;
      --text: #e9eef2;
      --muted: #a9b3bd;
      --brand: #009A44; /* Celtic FC green */
      --line: rgba(255,255,255,0.08);
      --radius: 14px;
      --shadow: 0 10px 28px rgba(0,0,0,.38);
      --maxw: 1120px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.65 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    a {
      color: var(--brand);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    img {
      max-width: 100%;
      height: auto;
      border-radius: calc(var(--radius) - 6px);
      display: block;
    }

    .container {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.5rem;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
    }

    .brand {
      font-weight: 700;
      letter-spacing: .03em;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    nav a {
      padding: .35rem .6rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    nav a:hover {
      background: rgba(0,154,68,.15);
      border-color: var(--line);
      text-decoration: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }

    h1, h2, h3 {
      line-height: 1.25;
      margin: 0 0 .6rem;
    }

    h1 { font-size: 2rem; }
